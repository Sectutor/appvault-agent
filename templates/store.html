<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppVault Store</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 0; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #111827; border-bottom: 1px solid #1e293b; }
.header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header .agent-id { font-size: 11px; color: #64748b; }
.header-links { display: flex; gap: 12px; }
.header-links a { color: #60a5fa; text-decoration: none; font-size: 13px; }
.header-links a:hover { text-decoration: underline; }
.controls { display: flex; gap: 12px; padding: 16px 24px; align-items: center; flex-wrap: wrap; background: #0f172a; }
.controls input { padding: 8px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 13px; flex: 1; max-width: 300px; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tabs button { padding: 6px 14px; border: 1px solid #334155; border-radius: 8px; background: #111827; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 12px; }
.nav-tabs button.active { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #fff; border-color: transparent; }
.content { padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; transition: border-color 0.2s, transform 0.2s; }
.card:hover { border-color: #60a5fa; transform: translateY(-2px); }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.icon { width: 48px; height: 48px; border-radius: 10px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.app-name { font-size: 18px; font-weight: 700; color: #fff; }
.app-cat { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
.desc { font-size: 14px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
.meta { font-size: 12px; color: #64748b; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-install { background: #22c55e; color: #fff; }
.btn-uninstall { background: #ef4444; color: #fff; }
.btn-launch { background: #3b82f6; color: #fff; }
.btn-restart { background: #f59e0b; color: #1e293b; }
.btn-spinner { background: #64748b; color: #fff; cursor: not-allowed; }
.status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-left: 8px; }
.status-installed { background: rgba(34,197,94,0.15); color: #22c55e; }
.status-available { background: rgba(100,116,139,0.15); color: #94a3b8; }
.status-stopped { background: rgba(234,179,8,0.15); color: #eab308; }
.toast { position: fixed; top: 20px; right: 20px; padding: 14px 24px; border-radius: 10px; color: #fff; font-weight: 600; z-index: 10000; transform: translateX(120%); transition: transform 0.3s; }
.toast.show { transform: translateX(0); }
.toast-success { background: #22c55e; }
.toast-error { background: #ef4444; }
.loading { text-align: center; padding: 60px; color: #64748b; font-size: 18px; }
.empty { text-align: center; padding: 60px; color: #64748b; }
.footer { text-align: center; padding: 20px; color: #475569; font-size: 11px; border-top: 1px solid #1e293b; margin-top: 20px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📦 AppVault Store</h1>
    <div class="agent-id" id="agentInfo">Connecting...</div>
  </div>
  <div class="header-links">
    <a href="/api/health">Agent Status</a>
  </div>
</div>

<!-- License key entry (unlock premium apps) -->
<div class="controls" style="padding-top:4px;padding-bottom:4px;gap:8px;">
  <span style="font-size:12px;color:#94a3b8;font-weight:600;">🔑 License:</span>
  <input id="license-input" type="text" placeholder="Enter your license key (e.g. APPVAULT-XXXX-XXXX-XXXX-XXXX)" style="flex:0 0 340px;padding:8px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:13px;">
  <button class="btn btn-install" onclick="applyLicense()" style="padding:8px 18px;">Apply</button>
  <span id="license-status" style="font-size:12px;color:#94a3b8;"></span>
</div>

<div class="controls">
  <div class="nav-tabs">
    <button class="active" onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('ai')">🤖 AI</button>
    <button onclick="filterCategory('productivity')">📋 Productivity</button>
    <button onclick="filterCategory('networking')">🌐 Networking</button>
    <button onclick="filterCategory('development')">💻 Dev</button>
    <button onclick="filterCategory('media')">🎬 Media</button>
    <button onclick="filterCategory('automation')">⚡ Automation</button>
  </div>
  <input id="search" placeholder="Search apps..." onkeyup="render()">
</div>

<div id="content" class="content">
  <div class="loading">Loading App Store...</div>
</div>

<div id="toast" class="toast"></div>

<div class="footer" id="footer"></div>

<script>
const API = '';

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

async function applyLicense() {
  const input = document.getElementById('license-input');
  const status = document.getElementById('license-status');
  const key = (input.value || '').trim();
  if (!key) { status.textContent = 'Please enter a license key'; status.style.color = '#f87171'; return; }
  status.textContent = 'Applying...'; status.style.color = '#fbbf24';
  const r = await api('/api/license', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ license_key: key }) });
  if (r.status === 'ok') {
    status.textContent = '✅ License applied — upgrading to paid (premium apps unlocked)';
    status.style.color = '#4ade80';
    setTimeout(loadCatalog, 1500);
  } else {
    status.textContent = '❌ ' + (r.message || 'Failed to apply license');
    status.style.color = '#f87171';
  }
}

let catalogData = null;
let currentCategory = 'all';

async function loadCatalog() {
  const data = await api('/api/catalog');
  catalogData = data;
  document.getElementById('agentInfo').textContent =
    data.agent_id ?
      'Agent: ' + data.agent_id.slice(0, 12) + '…  ·  Central: ' + data.central :
      'Connected  ·  ' + data.apps.length + ' apps';
  document.getElementById('footer').textContent =
    'AppVault Agent  ·  v' + (data.version || '1.0') + '  ·  ' + data.apps.length + ' apps in catalog';
  render();
}

function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const container = document.getElementById('content');
  if (!catalogData || !catalogData.apps) {
    container.innerHTML = '<div class="loading">Loading...</div>';
    return;
  }

  const search = document.getElementById('search').value.toLowerCase();
  let filtered = catalogData.apps;

  if (currentCategory !== 'all') {
    filtered = filtered.filter(a => a.category === currentCategory);
  }
  if (search) {
    filtered = filtered.filter(a =>
      a.name.toLowerCase().includes(search) ||
      a.description.toLowerCase().includes(search)
    );
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">No apps found</div>';
    return;
  }

  container.innerHTML = '<div class="grid">' + filtered.map(cardHtml).join('') + '</div>';
}

function cardHtml(app) {
  const status = app.status || 'available';
  const badge = '<span class="status status-' + status + '">' + status + '</span>';
  let buttons = '';

  if (status === 'installed') {
    buttons = '<button class="btn btn-launch" onclick="window.open(\'http://localhost:' + (app.container_port || '') + '\', \'_blank\')">🚀 Launch</button> '
      + '<button class="btn btn-uninstall" onclick="uninstall(\'' + app.id + '\', \'' + app.name + '\')">🗑 Uninstall</button>';
  } else if (status === 'stopped') {
    buttons = '<button class="btn btn-restart" onclick="restart(\'' + app.id + '\')">🔁 Start</button> '
      + '<button class="btn btn-uninstall" onclick="uninstall(\'' + app.id + '\', \'' + app.name + '\')">🗑 Remove</button>';
  } else {
    buttons = '<button class="btn btn-install" data-id="' + app.id + '" onclick="install(this)">⬇ Install</button>';
  }

  return '<div class="card">'
    + '<div class="card-header">'
    + '<div class="icon">📦</div>'
    + '<div><div class="app-name">' + app.name + badge + '</div>'
    + '<div class="app-cat">' + (app.category || 'app') + '</div></div></div>'
    + '<div class="desc">' + (app.description || '') + '</div>'
    + '<div class="meta">'
    + (app.min_ram_mb ? '<span>💾 ' + app.min_ram_mb + 'MB+</span>' : '')
    + '<span>🐳 ' + (app.image || '').split('/').pop() + '</span>'
    + '</div>' + buttons + '</div>';
}

async function install(btn) {
  const id = btn.dataset.id;
  btn.textContent = '⏳ Installing...';
  btn.className = 'btn btn-spinner';
  btn.disabled = true;
  const r = await api('/api/install/' + id, { method: 'POST' });
  if (r.error) {
    showToast('❌ ' + r.error, 'error');
    btn.textContent = '⬇ Install';
    btn.className = 'btn btn-install';
    btn.disabled = false;
  } else {
    showToast('✅ ' + id + ' installed!', 'success');
    setTimeout(loadCatalog, 2000);
  }
}

async function uninstall(id, name) {
  if (!confirm('Uninstall ' + name + '?')) return;
  const r = await api('/api/uninstall/' + id, { method: 'POST' });
  if (!r.error) {
    showToast('🗑 ' + name + ' uninstalled', 'success');
    setTimeout(loadCatalog, 2000);
  } else {
    showToast('❌ ' + r.error, 'error');
  }
}

async function restart(id) {
  const r = await api('/api/restart/' + id, { method: 'POST' });
  if (!r.error) {
    showToast('🔁 Restarted!', 'success');
    setTimeout(loadCatalog, 2000);
  } else {
    showToast('❌ ' + r.error, 'error');
  }
}

async function loadLicense() {
  try {
    const r = await api('/api/license');
    const status = document.getElementById('license-status');
    if (status && r.license_key) {
      status.textContent = '🔑 Active license: ' + r.license_key;
      status.style.color = '#4ade80';
      const input = document.getElementById('license-input');
      if (input) input.value = r.license_key;
    }
  } catch (e) {}
}

// Refresh every 15s
loadLicense();
loadCatalog();
setInterval(loadCatalog, 15000);
</script>
</body>
</html>
