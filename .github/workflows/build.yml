# Build & push appvault-agent to ghcr on every push (and on v* tags).
# Push to main/master  -> ghcr.io/sectutor/appvault-agent:{latest, sha-<short>}
# Push a v* tag        -> ghcr.io/sectutor/appvault-agent:<tag>
# No secrets needed: the built-in GITHUB_TOKEN can write packages for the owner.
name: build-agent-image
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build & push
        run: |
          IMG=ghcr.io/sectutor/appvault-agent
          docker build -t "$IMG:latest" .
          docker push "$IMG:latest"
          docker tag "$IMG:latest" "$IMG:sha-${GITHUB_SHA::7}"
          docker push "$IMG:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMG:latest" "$IMG:${GITHUB_REF#refs/tags/}"
            docker push "$IMG:${GITHUB_REF#refs/tags/}"
          fi
