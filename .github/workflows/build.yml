# Build & push appvault-agent to ghcr on every push (and on v* tags), then auto-deploy to Coolify.
# Push to main/master  -> ghcr.io/sectutor/appvault-agent:{latest, sha-<short>}
# Push a v* tag        -> ghcr.io/sectutor/appvault-agent:<tag>
# GHCR_PAT secret must be a PAT with write:packages (GITHUB_TOKEN cannot write to unlinked packages).
name: build-agent-image
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr (PAT)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u Sectutor --password-stdin
      - name: Build & push
        run: |
          IMG=ghcr.io/sectutor/appvault-agent
          docker build -t "$IMG:latest" .
          docker push "$IMG:latest"
          docker tag "$IMG:latest" "$IMG:sha-${GITHUB_SHA::7}"
          docker push "$IMG:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMG:latest" "$IMG:${GITHUB_REF#refs/tags/}"
            docker push "$IMG:${GITHUB_REF#refs/tags/}"
          fi
      - name: Trigger Coolify redeploy
        if: always()
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "⚠️ COOLIFY_URL/COOLIFY_TOKEN secrets not set — skipping Coolify deploy"
            exit 0
          fi
          for UUID in ${{ vars.COOLIFY_APP_UUIDS }}; do
            echo "→ Deploying app $UUID on Coolify"
            curl -sf -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"uuid\": \"$UUID\", \"force\": true}" \
              "$COOLIFY_URL/api/v1/deploy" || echo "  (deploy failed or UUID unknown — check Coolify)"
          done
